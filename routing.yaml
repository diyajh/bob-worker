# Which model handles which task type.
default: worker-small
tasks:
  strings: worker-small
  keys: worker-small
  lists: worker-small
  hashes: worker-small
  integration: worker-small
models:
  worker-small:
    provider: configured-in-bob-env   # cheapest available model; must fail often at baseline
    max_tokens: 8000
    temperature: 0.7
